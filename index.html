<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Apptify</title>
  
  <!-- iOS & PWA Native App Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Apptify" />
  <meta name="theme-color" content="#F8F9FA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0D0E10" media="(prefers-color-scheme: dark)" />
  
  <link rel="icon" type="image/png" href="/icon.png?v=2" />
  <link rel="apple-touch-icon" href="/icon.png?v=2" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Tailwind CSS CDN Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: 'rgb(var(--color-primary) / <alpha-value>)',
            secondary: 'rgb(var(--color-secondary) / <alpha-value>)',
            accent: 'rgb(var(--color-accent) / <alpha-value>)',
            background: 'rgb(var(--color-background) / <alpha-value>)',
            surface: 'rgb(var(--color-surface) / <alpha-value>)',
            'text-main': 'rgb(var(--color-text-main) / <alpha-value>)',
            'text-muted': 'rgb(var(--color-text-muted) / <alpha-value>)',
            'border-color': 'rgb(var(--color-border) / <alpha-value>)',
            'input-bg': 'rgb(var(--color-input-bg) / <alpha-value>)',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'fade-in-down': 'fadeInDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'scale-in': 'scaleIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pulse-soft': 'pulseSoft 2.5s infinite ease-in-out',
            'bounce-soft': 'bounceSoft 2s infinite ease-in-out',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            fadeInDown: {
              '0%': { opacity: '0', transform: 'translateY(-12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            scaleIn: {
              '0%': { opacity: '0', transform: 'scale(0.96)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            pulseSoft: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.75' },
            },
            bounceSoft: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-4px)' },
            }
          }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Ambient Glowing Atmosphere */
    .bg-orb {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(120px);
      z-index: 0;
      opacity: 0.35;
      transition: opacity 0.8s ease;
    }
    .bg-orb-1 {
      top: -15%;
      left: -10%;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.35) 0%, rgba(56, 189, 248, 0) 70%);
    }
    .bg-orb-2 {
      bottom: -15%;
      right: -10%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.28) 0%, rgba(236, 72, 153, 0) 70%);
    }
    .bg-orb-3 {
      top: 40%;
      left: 30%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, rgba(14, 165, 233, 0) 65%);
    }
    .dark .bg-orb-1 {
      background: radial-gradient(circle, rgba(14, 116, 220, 0.28) 0%, transparent 70%);
    }
    .dark .bg-orb-2 {
      background: radial-gradient(circle, rgba(147, 51, 234, 0.22) 0%, transparent 70%);
    }
    .dark .bg-orb-3 {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.16) 0%, transparent 65%);
    }

    /* Tactile Grain Texture */
    .bg-grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.2.1",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
      "react/": "https://aistudiocdn.com/react@^19.2.1/",
      "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
      "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
      "recharts": "https://aistudiocdn.com/recharts@^3.5.1"
    }
  }
  </script>
</head>

<body>
  <!-- Ambient Atmospheric Backing -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <div class="bg-grain"></div>

  <!-- App Mount Root -->
  <div id="root" class="relative z-10"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
